<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoHub Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }
        header {
            background: #181818;
            border-bottom: 1px solid #2b2b2b;
            padding: 16px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        .logo { color: #ff3b3b; font-size: 24px; font-weight: 700; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .user-email { color: #aaa; font-size: 13px; }
        main { width: 92%; max-width: 1200px; margin: 28px auto 50px; }
        .panel {
            background: #181818;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 22px;
        }
        h1, h2 { margin-top: 0; }
        h1 { font-size: 26px; }
        h2 { font-size: 20px; margin-bottom: 18px; }
        .notice {
            padding: 12px 14px;
            border-radius: 8px;
            background: #242424;
            color: #ccc;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .notice.error { background: #3a1717; color: #ffd2d2; }
        .notice.success { background: #17351f; color: #ccf7d6; }
        form { display: grid; gap: 14px; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        label { display: grid; gap: 7px; color: #ccc; font-size: 14px; }
        input, textarea, select {
            width: 100%;
            border: 1px solid #333;
            border-radius: 8px;
            background: #101010;
            color: #fff;
            padding: 11px 12px;
            font: inherit;
            outline: none;
        }
        textarea { min-height: 110px; resize: vertical; }
        input:focus, textarea:focus, select:focus { border-color: #666; }
        .button-row { display: flex; flex-wrap: wrap; gap: 10px; }
        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 16px;
            background: #2b2b2b;
            color: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover { background: #3b3b3b; }
        button.primary { background: #ff3b3b; }
        button.primary:hover { background: #e43131; }
        button.danger { background: #5c2222; }
        button.danger:hover { background: #783030; }
        .hidden { display: none !important; }
        .login-wrap { max-width: 460px; margin: 50px auto; }
        .login-wrap .panel { padding: 24px; }
        .video-table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #2b2b2b; vertical-align: middle; }
        th { color: #aaa; font-size: 13px; }
        td { font-size: 14px; }
        .thumb-preview { width: 90px; height: 52px; object-fit: cover; border-radius: 5px; background: #222; }
        .status { text-transform: capitalize; color: #bbb; }
        .row-actions { display: flex; gap: 7px; flex-wrap: wrap; }
        .muted { color: #888; font-size: 13px; }
        @media (max-width: 700px) {
            header { align-items: flex-start; flex-direction: column; }
            .user-email { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
            main { width: 94%; margin-top: 18px; }
            .form-grid { grid-template-columns: 1fr; }
            .login-wrap { width: 94%; margin: 25px auto; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">VideoHub Admin</div>
    <div class="header-actions" id="headerActions" hidden>
        <span class="user-email" id="userEmail"></span>
        <button type="button" id="logoutButton">Logout</button>
    </div>
</header>

<section class="login-wrap" id="loginSection">
    <div class="panel">
        <h1>Admin Login</h1>
        <div class="notice">Sign in with the admin account you created in Supabase.</div>
        <div id="loginMessage" class="notice hidden"></div>
        <form id="loginForm">
            <label>
                Email
                <input id="loginEmail" type="email" required autocomplete="email">
            </label>
            <label>
                Password
                <input id="loginPassword" type="password" required autocomplete="current-password">
            </label>
            <button class="primary" type="submit">Sign In</button>
        </form>
    </div>
</section>

<main id="adminSection" class="hidden">
    <div id="adminMessage" class="notice hidden"></div>

    <section class="panel">
        <h1 id="formHeading">Add Video</h1>
        <p class="muted">Enter the Bunny Stream video ID and the thumbnail URL/path for the video.</p>
        <form id="videoForm">
            <input id="editingId" type="hidden">
            <div class="form-grid">
                <label>
                    Title
                    <input id="title" type="text" required maxlength="200">
                </label>
                <label>
                    Category
                    <select id="category" required>
                        <option value="Featured">Featured</option>
                        <option value="Popular">Popular</option>
                        <option value="New">New</option>
                        <option value="Trending">Trending</option>
                    </select>
                </label>
                <label>
                    Duration
                    <input id="duration" type="text" placeholder="10:25">
                </label>
                <label>
                    Status
                    <select id="status" required>
                        <option value="published">Published</option>
                        <option value="draft">Draft</option>
                    </select>
                </label>
                <label>
                    Thumbnail URL / Path
                    <input id="thumbnailUrl" type="text" placeholder="thumbnails/thumb1.jpg" required>
                </label>
                <label>
                    Bunny Video ID
                    <input id="bunnyVideoId" type="text" required>
                </label>
            </div>
            <label>
                Description
                <textarea id="description" maxlength="5000"></textarea>
            </label>
            <div class="button-row">
                <button class="primary" type="submit" id="saveButton">Add Video</button>
                <button type="button" id="cancelEditButton" class="hidden">Cancel Edit</button>
            </div>
        </form>
    </section>

    <section class="panel">
        <h2>Videos</h2>
        <div class="video-table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Thumbnail</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Duration</th>
                        <th>Status</th>
                        <th>Views</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="videoRows"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
const SUPABASE_URL = "https://tfrtklmrclcshgtscyuv.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_NTXTSlPXyrkDVVLTEwINYQ_pquFY6jB";
const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

const loginSection = document.getElementById("loginSection");
const adminSection = document.getElementById("adminSection");
const headerActions = document.getElementById("headerActions");
const userEmail = document.getElementById("userEmail");
const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");
const adminMessage = document.getElementById("adminMessage");
const logoutButton = document.getElementById("logoutButton");
const videoForm = document.getElementById("videoForm");
const videoRows = document.getElementById("videoRows");
const formHeading = document.getElementById("formHeading");
const saveButton = document.getElementById("saveButton");
const cancelEditButton = document.getElementById("cancelEditButton");

let currentVideos = [];

function showMessage(element, message, type = "") {
    element.textContent = message;
    element.className = "notice" + (type ? " " + type : "");
    element.classList.remove("hidden");
}

function hideMessage(element) {
    element.classList.add("hidden");
}

function resetForm() {
    videoForm.reset();
    document.getElementById("editingId").value = "";
    document.getElementById("status").value = "published";
    document.getElementById("category").value = "Featured";
    formHeading.textContent = "Add Video";
    saveButton.textContent = "Add Video";
    cancelEditButton.classList.add("hidden");
}

function enterAdmin(user) {
    loginSection.classList.add("hidden");
    adminSection.classList.remove("hidden");
    headerActions.hidden = false;
    userEmail.textContent = user.email || "Signed in";
}

function leaveAdmin() {
    adminSection.classList.add("hidden");
    loginSection.classList.remove("hidden");
    headerActions.hidden = true;
    userEmail.textContent = "";
    resetForm();
    videoRows.innerHTML = "";
}

async function isCurrentUserAdmin() {
    const { data, error } = await supabaseClient.rpc("is_admin");
    if (error) throw error;
    return data === true;
}

async function loadVideos() {
    hideMessage(adminMessage);
    const { data, error } = await supabaseClient
        .from("videos")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        showMessage(adminMessage, error.message, "error");
        return;
    }

    currentVideos = data || [];
    renderVideos();
}

function renderVideos() {
    videoRows.innerHTML = "";

    if (currentVideos.length === 0) {
        const row = document.createElement("tr");
        row.innerHTML = '<td colspan="7" class="muted">No videos found.</td>';
        videoRows.appendChild(row);
        return;
    }

    currentVideos.forEach(video => {
        const row = document.createElement("tr");
        const safeThumb = video.thumbnail_url || "";
        row.innerHTML = `
            <td>
                <img class="thumb-preview" src="${escapeHtml(safeThumb)}" alt="">
            </td>
            <td>${escapeHtml(video.title)}</td>
            <td>${escapeHtml(video.category)}</td>
            <td>${escapeHtml(video.duration || "-")}</td>
            <td class="status">${escapeHtml(video.status)}</td>
            <td>${Number(video.views || 0).toLocaleString()}</td>
            <td class="row-actions">
                <button type="button" data-edit="${video.id}">Edit</button>
                <button type="button" class="danger" data-delete="${video.id}">Delete</button>
            </td>
        `;
        videoRows.appendChild(row);
    });
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function editVideo(id) {
    const video = currentVideos.find(item => Number(item.id) === Number(id));
    if (!video) return;

    document.getElementById("editingId").value = video.id;
    document.getElementById("title").value = video.title || "";
    document.getElementById("category").value = video.category || "Featured";
    document.getElementById("duration").value = video.duration || "";
    document.getElementById("status").value = video.status || "published";
    document.getElementById("thumbnailUrl").value = video.thumbnail_url || "";
    document.getElementById("bunnyVideoId").value = video.bunny_video_id || "";
    document.getElementById("description").value = video.description || "";

    formHeading.textContent = "Edit Video";
    saveButton.textContent = "Save Changes";
    cancelEditButton.classList.remove("hidden");
    window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteVideo(id) {
    const video = currentVideos.find(item => Number(item.id) === Number(id));
    if (!video) return;

    const confirmed = window.confirm(
        `Delete "${video.title}" from the VideoHub database? This does not delete the Bunny video itself.`
    );
    if (!confirmed) return;

    const { error } = await supabaseClient
        .from("videos")
        .delete()
        .eq("id", id);

    if (error) {
        showMessage(adminMessage, error.message, "error");
        return;
    }

    showMessage(adminMessage, "Video deleted successfully.", "success");
    await loadVideos();
}

loginForm.addEventListener("submit", async event => {
    event.preventDefault();
    hideMessage(loginMessage);

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        showMessage(loginMessage, error.message, "error");
        return;
    }

    try {
        const admin = await isCurrentUserAdmin();
        if (!admin) {
            await supabaseClient.auth.signOut();
            showMessage(loginMessage, "This account is not an admin account.", "error");
            return;
        }
    } catch (error) {
        await supabaseClient.auth.signOut();
        showMessage(loginMessage, "Admin check failed: " + error.message, "error");
        return;
    }

    enterAdmin(data.user);
    await loadVideos();
});

videoForm.addEventListener("submit", async event => {
    event.preventDefault();
    hideMessage(adminMessage);

    const payload = {
        title: document.getElementById("title").value.trim(),
        description: document.getElementById("description").value.trim(),
        category: document.getElementById("category").value,
        thumbnail_url: document.getElementById("thumbnailUrl").value.trim(),
        bunny_video_id: document.getElementById("bunnyVideoId").value.trim(),
        duration: document.getElementById("duration").value.trim(),
        status: document.getElementById("status").value
    };

    const editingId = document.getElementById("editingId").value;
    let error;

    if (editingId) {
        ({ error } = await supabaseClient
            .from("videos")
            .update(payload)
            .eq("id", editingId));
    } else {
        ({ error } = await supabaseClient
            .from("videos")
            .insert(payload));
    }

    if (error) {
        showMessage(adminMessage, error.message, "error");
        return;
    }

    showMessage(
        adminMessage,
        editingId ? "Video updated successfully." : "Video added successfully.",
        "success"
    );

    resetForm();
    await loadVideos();
});

cancelEditButton.addEventListener("click", resetForm);

videoRows.addEventListener("click", event => {
    const editButton = event.target.closest("[data-edit]");
    const deleteButton = event.target.closest("[data-delete]");

    if (editButton) editVideo(editButton.dataset.edit);
    if (deleteButton) deleteVideo(deleteButton.dataset.delete);
});

logoutButton.addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    leaveAdmin();
});

supabaseClient.auth.onAuthStateChange(async (_event, session) => {
    if (!session) {
        leaveAdmin();
        return;
    }

    try {
        const admin = await isCurrentUserAdmin();
        if (!admin) {
            await supabaseClient.auth.signOut();
            showMessage(loginMessage, "This account is not an admin account.", "error");
            return;
        }

        enterAdmin(session.user);
        await loadVideos();
    } catch (error) {
        await supabaseClient.auth.signOut();
        showMessage(loginMessage, "Admin check failed: " + error.message, "error");
    }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VideoHub - Video</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: white;
        }

        /* Header */
        header {
            height: 65px;
            background: #171717;
            display: flex;
            align-items: center;
            padding: 0 5%;
            border-bottom: 1px solid #292929;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #ff3b3b;
            cursor: pointer;
        }

        /* Main */
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        /* Video */
        .video-container {
            width: 100%;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;
            max-height: 680px;
            background: #000;
        }

        /* Information */
        .video-info {
            padding: 22px 0;
        }

        .video-title {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .video-meta {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .video-meta span {
            margin-right: 18px;
        }

        .description {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        /* Buttons */
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            background: #292929;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #3b3b3b;
        }

        .like-button.liked {
            background: #ff3b3b;
        }

        .like-count {
            margin-left: 6px;
            color: #ccc;
        }

        .back-button {
            background: #ff3b3b;
        }

        .back-button:hover {
            background: #e52f2f;
        }

        /* Related videos */
        .related {
            margin-top: 45px;
        }

        .related h2 {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .related-card {
            background: #191919;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .related-card:hover {
            transform: translateY(-4px);
        }

        .related-card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }

        .related-title {
            padding: 12px;
            font-size: 15px;
        }

        /* Mobile */
        @media (max-width: 768px) {

            header {
                padding: 0 20px;
            }

            .container {
                width: 94%;
                margin: 20px auto;
            }

            .video-title {
                font-size: 22px;
            }

            .related-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ================= RESPONSIVE POLISH ================= */

        .video-container {
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        .related-card img {
            transition: transform 0.25s ease;
        }

        .related-card:hover img {
            transform: scale(1.04);
        }

        @media (max-width: 768px) {

            .container {
                width: 94%;
                margin: 16px auto 30px;
            }

            .video-container {
                border-radius: 7px;
            }

            video {
                max-height: 60vh;
            }

            .video-title {
                font-size: 21px;
                line-height: 1.3;
            }

            .actions {
                gap: 8px;
            }

            .actions button {
                flex: 1;
                min-width: 120px;
            }

            .related {
                margin-top: 30px;
            }
        }

        @media (max-width: 420px) {

            .container {
                width: 96%;
            }

            .actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .actions .back-button {
                grid-column: 1 / -1;
            }

            .related-grid {
                grid-template-columns: 1fr;
            }
        }
        
    </style>
</head>

<body>

    <header>
        <div class="logo" onclick="goHome()">VideoHub</div>
    </header>

    <main class="container">

        <!-- Video Player -->
        <div class="video-container">
            <video id="videoPlayer" controls>
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
                Your browser does not support video playback.
            </video>
        </div>

        <!-- Video Information -->
        <section class="video-info">

            <h1 class="video-title" id="videoTitle">
                Loading...
            </h1>

            <div class="video-meta">
                <span id="videoViews">0 views</span>
                <span id="videoCategory">Category</span>
                <span id="videoDate">Today</span>
            </div>

            <p class="description" id="videoDescription">
                Loading video description...
            </p>

            <div class="actions">
                <button id="likeButton" class="like-button" onclick="likeVideo()">👍 Like <span class="like-count"
                        id="likeCount">0</span></button>

                <button onclick="shareVideo()">🔗 Share</button>

                <button class="back-button" onclick="goHome()">
                    ← Back to VideoHub
                </button>
            </div>

        </section>

        <!-- Related Videos -->
        <section class="related">

            <h2>Related Videos</h2>

            <div class="related-grid" id="relatedVideos"></div>

        </section>

    </main>

    <script>

        const videos = [

            {
                id: 1,
                title: "Demo Video One",
                category: "Featured",
                views: "12K",
                date: "Today",
                description: "This is a demonstration video for the VideoHub website.",
                thumbnail: "thumbnails/thumb1.jpg"
            },

            {
                id: 2,
                title: "Demo Video Two",
                category: "Popular",
                views: "8.4K",
                date: "Yesterday",
                description: "This is another demonstration video on VideoHub.",
                thumbnail: "thumbnails/thumb2.jpg"
            },

            {
                id: 3,
                title: "Demo Video Three",
                category: "New",
                views: "5.2K",
                date: "2 days ago",
                description: "A new demonstration video for the VideoHub project.",
                thumbnail: "thumbnails/thumb3.jpg"
            },

            {
                id: 4,
                title: "Demo Video Four",
                category: "Trending",
                views: "4.8K",
                date: "3 days ago",
                description: "A trending demonstration video on VideoHub.",
                thumbnail: "thumbnails/thumb4.jpg"
            },

            {
                id: 5,
                title: "Demo Video Five",
                category: "Popular",
                views: "3.7K",
                date: "4 days ago",
                description: "Another popular demonstration video.",
                thumbnail: "thumbnails/thumb5.jpg"
            },

            {
                id: 6,
                title: "Demo Video Six",
                category: "New",
                views: "2.1K",
                date: "5 days ago",
                description: "A fresh demonstration video for VideoHub.",
                thumbnail: "thumbnails/thumb6.jpg"
            }

        ];

        // Get video ID from URL
        const params = new URLSearchParams(window.location.search);
        const videoId = Number(params.get("id"));

        // Find selected video
        const currentVideo = videos.find(video => video.id === videoId);

        if (currentVideo) {

            document.title = currentVideo.title + " - VideoHub";

            document.getElementById("videoTitle").textContent =
                currentVideo.title;

            document.getElementById("videoViews").textContent =
                currentVideo.views + " views";

            document.getElementById("videoCategory").textContent =
                currentVideo.category;

            document.getElementById("videoDate").textContent =
                currentVideo.date;

            document.getElementById("videoDescription").textContent =
                currentVideo.description;

        } else {

            document.getElementById("videoTitle").textContent =
                "Video Not Found";

            document.getElementById("videoDescription").textContent =
                "The requested video could not be found.";

        }

        // Related videos
        const relatedContainer =
            document.getElementById("relatedVideos");

        videos
            .filter(video => video.id !== videoId)
            .slice(0, 3)
            .forEach(video => {

                const card = document.createElement("div");

                card.className = "related-card";

                card.innerHTML = `
                    <img src="${video.thumbnail}" alt="${video.title}">
                    <div class="related-title">
                        ${video.title}
                    </div>
                `;

                card.addEventListener("click", function () {

                    window.location.href =
                        "video.html?id=" + video.id;

                });

                relatedContainer.appendChild(card);

            });

        // Home
        function goHome() {

            window.location.href = "index.html";

        }

        // Like system
        const likeButton = document.getElementById("likeButton");
        const likeKey = "videohub-liked-" + videoId;
        const countKey = "videohub-like-count-" + videoId;

        let isLiked = localStorage.getItem(likeKey) === "true";
        let likes = Number(localStorage.getItem(countKey)) || 0;

        function updateLikeButton() {

            likeButton.innerHTML = isLiked
                ? '❤️ Liked <span class="like-count">' + likes + '</span>'
                : '👍 Like <span class="like-count">' + likes + '</span>';

            likeButton.classList.toggle("liked", isLiked);
        }

        function likeVideo() {

            if (isLiked) {
                isLiked = false;
                likes = Math.max(0, likes - 1);
            } else {
                isLiked = true;
                likes += 1;
            }

            localStorage.setItem(likeKey, isLiked);
            localStorage.setItem(countKey, likes);

            updateLikeButton();
        }

        updateLikeButton();


        // Demo local play counter
        const viewKey = "videohub-plays-" + videoId;
        let demoPlays = Number(localStorage.getItem(viewKey)) || 0;

        demoPlays += 1;
        localStorage.setItem(viewKey, demoPlays);

        if (currentVideo) {
            document.getElementById("videoViews").textContent =
                currentVideo.views +
                " views • " +
                demoPlays +
                " local plays";
        }

        // Share
        async function shareVideo() {

            const shareData = {
                title: currentVideo
                    ? currentVideo.title
                    : "VideoHub",
                url: window.location.href
            };

            if (navigator.share) {

                try {
                    await navigator.share(shareData);
                } catch (error) {
                    // Sharing was cancelled.
                }

            } else if (navigator.clipboard) {

                try {
                    await navigator.clipboard.writeText(
                        window.location.href
                    );

                    alert("Video link copied!");

                } catch (error) {
                    alert("Copy failed. Please copy the URL manually.");
                }

            } else {
                alert("Copy the video URL from your browser address bar.");
            }
        }

    </script>

</body>

</html>
